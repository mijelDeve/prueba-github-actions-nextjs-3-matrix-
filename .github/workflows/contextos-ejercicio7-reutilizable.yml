name: workflow reutilizable

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      enviroment:
        required: true
        type: string

jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
