name: Frontend CI

on:
    push:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - name: Upload build
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: dist/
                  retention-days: 14